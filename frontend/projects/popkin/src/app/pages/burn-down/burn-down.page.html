<div pk-app-screen [accent]="frame.accent()" layout="tab" [body]="body()">
  <header pk-plan-header slot="header" heading="Burn-down" [sub]="store.sprintDays()">
    <nav pk-view-nav slot="views" [views]="views()"></nav>
  </header>

  @switch (store.state()) {
    @case ('loading') {
      <div pk-burn [loading]="true"></div>
    }
    @case ('off') {
      <div class="stack">
        <div pk-empty-state icon="power" heading="Plan is switched off" [text]="offText()">
          <a pk-button variant="primary" size="md" [routerLink]="home()">
            <svg pk-icon name="back" size="md"></svg>Back to {{ frame.name() }}
          </a>
        </div>
      </div>
    }
    @case ('error') {
      <div class="stack">
        <div
          pk-empty-state
          icon="offline"
          heading="We couldn’t load the burn-down"
          text="It’s safe. Check your connection and try again."
          [alert]="true"
        >
          <button pk-button type="button" variant="primary" size="md" (click)="store.retry()">
            <svg pk-icon name="retry" size="md"></svg>Try again
          </button>
        </div>
      </div>
    }
    @case ('empty') {
      <div class="stack">
        <div
          pk-empty-state
          icon="board"
          heading="Nothing to burn down yet"
          text="Add a story or two and the chart draws itself as they get done."
        >
          @if (!frame.wrappedUp()) {
            <button pk-button type="button" variant="popkin" size="md" (click)="newStory()">
              <svg pk-icon name="plus" size="md"></svg>New story
            </button>
          }
        </div>
      </div>
    }
    @case ('ready') {
      <div
        pk-burn
        [headline]="store.headline()"
        [badge]="store.badge()"
        [forecast]="store.forecast()"
      >
        @if (store.chart(); as chart) {
          <figure pk-burn-chart slot="chart" [chart]="chart" [text]="store.chartText()"></figure>
        }
        <aside
          pk-biggest-open
          slot="aside"
          [stories]="store.biggest()"
          [empty]="nothingOpen()"
        ></aside>
      </div>
    }
  }

  <nav
    pk-popkin-nav
    slot="nav"
    current="plan"
    [popkinId]="popkinId()"
    [name]="frame.name()"
    [emoji]="frame.emoji()"
    [members]="frame.members()"
    [timeLeft]="frame.timeLeft()"
    [unread]="unreadCount()"
    [schedule]="frame.schedules()"
    [plan]="frame.plan()"
  ></nav>
</div>
