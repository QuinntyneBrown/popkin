<div
  pk-screen
  layout="split"
  body="middle"
  heading="Got a code?"
  lead="Type the code or paste the link from your invite."
>
  <aside
    pk-split-aside
    slot="aside"
    label="Popkin"
    photo="/images/bonfire.jpg"
    heading="Everyone around the same fire."
    text="One link, one QR code, and your whole group is in."
  ></aside>
  <header pk-top-bar slot="header" back="/welcome"></header>
  <form id="join-code" class="stack stack--lg" novalidate (submit)="find($event)">
    <div
      pk-text-field
      fieldId="code"
      label="Invite code or link"
      autocomplete="off"
      autocapitalize="none"
      placeholder="Code or link"
      hint="The code is the last part of your invite link."
      [formControl]="code"
      [readonly]="join.state() === 'finding'"
    ></div>
  </form>
  <ng-container slot="actions">
    <button
      pk-button
      variant="primary"
      type="submit"
      form="join-code"
      [block]="true"
      [busy]="join.state() === 'finding'"
    >
      {{ join.state() === 'finding' ? 'Finding your Popkin…' : 'Find my Popkin' }}
    </button>
    <button pk-button variant="quiet" type="button" [block]="true" (click)="scan()">
      Scan a QR code instead
    </button>
  </ng-container>
</div>
