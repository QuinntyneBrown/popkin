<div
  pk-photo-viewer
  [accent]="frame.accent()"
  [state]="state()"
  [name]="photo()?.uploader?.displayName ?? ''"
  [avatar]="avatar()"
  [time]="store.when()"
  [src]="photo()?.imageUrl ?? ''"
  [alt]="store.name()"
  [width]="photo()?.width"
  [height]="photo()?.height"
  [caption]="photo()?.caption ?? ''"
  [reactions]="reactions()"
  [quickReactions]="quick()"
  [comments]="commentCount()"
  [commentList]="commentList()"
  [readOnly]="readOnly()"
  [canDelete]="canDelete()"
  [saving]="store.saving()"
  [(commentDraft)]="comments.draft"
  [posting]="comments.posting()"
  [back]="back()"
  (closed)="close()"
  (previous)="go('previous')"
  (next)="go('next')"
  (imageError)="store.imageFailed()"
  (retried)="store.retry()"
  (react)="store.react($event)"
  (moreReactions)="moreReactions()"
  (openComments)="openComments()"
  (postComment)="postComment()"
  (deleteComment)="deleteComment($event)"
  (save)="store.save()"
  (actions)="actions()"
></div>
