<div pk-screen layout="column">
  <header
    pk-top-bar
    slot="header"
    back="/contacts/people"
    backLabel="Cancel"
    backIcon="close"
    heading="Add someone"
    [line]="true"
    [sticky]="true"
  >
    <button
      pk-button
      slot="end"
      variant="primary"
      size="sm"
      type="submit"
      form="contact-form"
      [busy]="saving()"
    >
      {{ saving() ? 'Saving…' : 'Save' }}
    </button>
  </header>
  <form pk-form-sections id="contact-form" novalidate (submit)="save($event)">
    @if (problems().length) {
      <div pk-form-summary [problems]="problems()"></div>
    }
    <section pk-form-section heading="Who">
      <div
        pk-photo-picker
        label="Add a photo"
        [photo]="preview()"
        [accept]="accept"
        [disabled]="saving()"
        (picked)="pick($event)"
      ></div>
      <div
        pk-text-field
        fieldId="name"
        label="Name"
        placeholder="Their name"
        autocomplete="off"
        [formControl]="form.controls.name"
        [readonly]="saving()"
        [error]="store.state() === 'invalid' ? nameMessage : undefined"
      ></div>
      <div
        pk-text-field
        fieldId="relation"
        label="How you know them"
        placeholder="Sister, neighbour, old boss…"
        [formControl]="form.controls.knownAs"
        [readonly]="saving()"
      ></div>
      <div
        pk-choice-chips
        fieldId="circle"
        label="Circle"
        [options]="circles"
        [(value)]="circle"
        [disabled]="saving()"
      ></div>
    </section>
    <section pk-form-section heading="Details" hint="Optional.">
      <div pk-form-pair>
        <div
          pk-text-field
          fieldId="phone"
          label="Phone"
          type="tel"
          placeholder="+44"
          [formControl]="form.controls.phone"
          [readonly]="saving()"
        ></div>
        <div
          pk-text-field
          fieldId="email"
          label="Email"
          type="email"
          [formControl]="form.controls.email"
          [readonly]="saving()"
        ></div>
        <div
          pk-text-field
          fieldId="city"
          label="City"
          [formControl]="form.controls.city"
          [readonly]="saving()"
        ></div>
        <div
          pk-text-field
          fieldId="likes"
          label="Things they love"
          placeholder="Jazz, cycling, Arsenal…"
          [formControl]="form.controls.loves"
          [readonly]="saving()"
        ></div>
      </div>
    </section>
  </form>
</div>
