<div pk-dialog heading="Features" [description]="description" [accent]="data.accent">
  @if (failed()) {
    <div pk-alert heading="We couldn’t save your changes.">Try again.</div>
  }
  <div pk-stack gap="sm">
    @for (choice of choices(); track choice.feature) {
      <div
        pk-setting-row
        [icon]="choice.icon"
        [heading]="choice.title"
        [text]="choice.text"
        [disabled]="busy()"
        [checked]="choice.on"
        (checkedChange)="toggle(choice.feature, $event)"
      ></div>
    }
  </div>
  <button
    pk-button
    slot="footer"
    type="button"
    variant="popkin"
    [block]="true"
    [busy]="busy()"
    [disabled]="busy()"
    (click)="save()"
  >
    {{ busy() ? 'Saving…' : 'Save' }}
  </button>
  <button
    pk-button
    slot="footer"
    type="button"
    variant="quiet"
    [block]="true"
    [disabled]="busy()"
    (click)="cancel()"
  >
    Cancel
  </button>
</div>
