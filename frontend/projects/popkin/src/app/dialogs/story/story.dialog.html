<div
  pk-dialog
  [heading]="data.story.title"
  [description]="line"
  [accent]="data.accent"
  [panel]="true"
>
  @if (failed()) {
    <div pk-alert heading="We couldn’t save that.">Your changes are still here. Try again.</div>
  }
  <div
    pk-text-field
    fieldId="stitle"
    label="What needs doing?"
    [maxlength]="80"
    [readonly]="busy()"
    [formControl]="title"
  ></div>
  <div class="stack">
    <span pk-field-label aria-hidden="true">Where does it go?</span>
    <div
      pk-segmented-control
      kind="radio"
      label="Where does it go?"
      [options]="whereOptions"
      [(value)]="where"
      [disabled]="busy()"
    ></div>
  </div>
  <div
    pk-points-picker
    fieldId="spoints"
    label="How big is it?"
    hint="1 is a quick text. 8 is a weekend of phone calls."
    [(value)]="points"
    [disabled]="busy()"
  ></div>
  <div
    pk-who-chips
    fieldId="sowner"
    label="Who’s on it?"
    none="No one yet. Anyone can pick it up."
    [members]="members()"
    [(value)]="owner"
    [disabled]="busy()"
  ></div>
  <div pk-tag-picker fieldId="stag" label="Tag" [(value)]="tag" [disabled]="busy()"></div>
  <div
    pk-text-field
    fieldId="sdue"
    label="Due"
    optional="(optional)"
    type="date"
    [readonly]="busy()"
    [formControl]="due"
  ></div>
  @if (!done) {
    <div class="cluster" slot="footer">
      @if (move; as move) {
        <button
          pk-button
          type="button"
          variant="secondary"
          [disabled]="busy()"
          (click)="moveTo(move.to)"
        >
          {{ move.label }}
        </button>
      }
      <button
        pk-button
        type="button"
        variant="secondary"
        [disabled]="busy()"
        (click)="moveTo('Done')"
      >
        Mark done
      </button>
    </div>
  }
</div>
