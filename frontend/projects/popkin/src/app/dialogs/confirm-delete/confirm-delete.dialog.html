<div
  pk-dialog
  [heading]="data.heading"
  [titleId]="data.titleId ?? 'dlg-title'"
  [descriptionId]="data.descriptionId ?? 'dlg-desc'"
  [description]="data.description"
  [accent]="data.accent"
>
  <button
    pk-button
    slot="footer"
    type="button"
    variant="danger"
    [block]="true"
    (click)="close(true)"
  >
    Delete
  </button>
  <button
    pk-button
    slot="footer"
    type="button"
    variant="secondary"
    cdkFocusInitial
    [block]="true"
    (click)="close(false)"
  >
    {{ data.keep }}
  </button>
</div>
