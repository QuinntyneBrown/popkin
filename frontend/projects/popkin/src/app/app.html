<a pk-skip-link>Skip to content</a>
<router-outlet />
<div pk-toast-region>
  @for (toast of toaster.toasts(); track toast.id) {
    <div
      pk-toast
      [variant]="toast.variant"
      [heading]="toast.heading"
      [text]="toast.text"
      [action]="toast.action?.label"
      (acted)="toaster.act(toast)"
      (dismissed)="toaster.dismiss(toast.id)"
    ></div>
  }
</div>
