@if (closed(); as line) {
  <p class="composer__closed">{{ line }}</p>
} @else {
  @if (reply(); as replying) {
    <div class="composer__reply">
      <div class="grow">
        <strong>Replying to {{ replying.firstName }}</strong>
        <span class="truncate text-muted">{{ replying.snippet }}</span>
      </div>
      <button
        pk-icon-button
        type="button"
        icon="close"
        size="md"
        label="Cancel reply"
        (click)="cancel()"
      ></button>
    </div>
  }
  @if (photoProblem(); as problem) {
    <div pk-alert class="composer__alert" action="Dismiss" (acted)="onDismissPhotoProblem()">
      {{ problem }}
    </div>
  }
  @if (photo(); as preview) {
    <div class="composer__photo">
      <img [src]="preview" alt="Photo to send" />
      <button
        pk-icon-button
        class="composer__remove"
        type="button"
        variant="card"
        icon="close"
        size="md"
        label="Remove photo"
        (click)="onRemovePhoto()"
      ></button>
    </div>
  }
  <form class="composer__row" (submit)="submit($event)">
    <ng-content select="[slot=start]" />
    <div class="composer__field">
      <textarea
        #field
        class="composer__input"
        rows="1"
        [attr.aria-label]="label()"
        [attr.maxlength]="maxLength()"
        [placeholder]="label()"
        [disabled]="disabled()"
        [readOnly]="busy()"
        [value]="value()"
        (input)="value.set(field.value)"
        (keydown)="onKeydown($event)"
      ></textarea>
      <ng-content select="[slot=tools]" />
      @if (photos()) {
        <button
          #choose
          pk-icon-button
          class="composer__tool"
          type="button"
          icon="camera"
          label="Photo"
          [disabled]="disabled()"
          (click)="openPicker()"
        ></button>
        <input #picker type="file" hidden [accept]="accept" (change)="onPicked(picker)" />
      }
    </div>
    <button
      pk-icon-button
      type="submit"
      variant="send"
      icon="send"
      size="md"
      [label]="sendLabel()"
      [attr.aria-busy]="busy() ? 'true' : null"
      [disabled]="!canSend()"
    ></button>
  </form>
  <p class="composer__count" [class.composer__count--shown]="count()" aria-live="polite">
    {{ count() }}
  </p>
}
