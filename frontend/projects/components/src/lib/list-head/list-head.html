@if (level() === 2) {
  <h2
    class="list-head__title"
    [class.list-head__title--late]="tone() === 'late'"
    [class.list-head__title--quiet]="tone() === 'quiet'"
    [id]="headingId()"
  >
    <ng-container *ngTemplateOutlet="title" />
  </h2>
} @else {
  <h3
    class="list-head__title"
    [class.list-head__title--late]="tone() === 'late'"
    [class.list-head__title--quiet]="tone() === 'quiet'"
    [id]="headingId()"
  >
    <ng-container *ngTemplateOutlet="title" />
  </h3>
}
@if (link() && linkLabel()) {
  <a pk-link variant="accent" [routerLink]="link()">{{ linkLabel() }}</a>
}
<ng-template #title>
  @if (icon(); as name) {
    <svg pk-icon [name]="name" size="sm"></svg>
  }
  <!-- In its own span, so no space comes between the words and the count's margin. -->
  <span>{{ heading() }}</span>
  @if (count() !== undefined) {
    <span class="list-head__count">{{ count() }}</span>
  }
</ng-template>
