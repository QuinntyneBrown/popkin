@if (heading()) {
  <div class="panel__head">
    <div>
      <h2 class="panel__title">{{ heading() }}</h2>
      @if (sub()) {
        <p class="panel__sub">{{ sub() }}</p>
      }
    </div>
    <ng-content select="[slot=head]" />
  </div>
}
<ng-template #content><ng-content /></ng-template>
@if (body()) {
  <div class="panel__body"><ng-container [ngTemplateOutlet]="content" /></div>
} @else {
  <ng-container [ngTemplateOutlet]="content" />
}
<ng-content select="[slot=after]" />
@if (foot()) {
  <div class="panel__foot"><ng-content select="[slot=foot]" /></div>
}
