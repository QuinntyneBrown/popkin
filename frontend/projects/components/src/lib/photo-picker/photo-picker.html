@if (fixed()) {
  <span
    pk-avatar
    [size]="size() === 'xl' ? 'xl' : '2xl'"
    [initials]="initial()"
    [photo]="photo()"
  ></span>
} @else {
  <button
    class="photo-picker__button"
    type="button"
    [attr.aria-label]="label()"
    [attr.aria-describedby]="
      error() ? 'photo-picker-error' : caption() ? 'photo-picker-caption' : null
    "
    [disabled]="disabled()"
    (click)="open()"
  >
    @if (size() === 'xl') {
      <span pk-avatar size="xl" initials="" [photo]="photo()" [blank]="!photo()"></span>
      @if (!photo()) {
        <svg pk-icon class="photo-picker__camera" name="camera"></svg>
      }
    } @else {
      <span pk-avatar size="2xl" [initials]="initial()" [photo]="photo()" [blank]="!photo()"></span>
      <span class="photo-picker__badge"><svg pk-icon name="camera" size="md"></svg></span>
    }
  </button>
}
@if (size() === 'xl') {
  <div class="photo-picker__field"><ng-content /></div>
}
<input
  #file
  class="photo-picker__file"
  type="file"
  tabindex="-1"
  aria-hidden="true"
  [accept]="accept()"
  (change)="choose()"
/>
@if (error()) {
  <p class="photo-picker__error" id="photo-picker-error" role="alert">
    <svg pk-icon name="alert" size="sm"></svg><span>{{ error() }}</span>
  </p>
} @else if (caption()) {
  <p class="photo-picker__caption" id="photo-picker-caption">{{ caption() }}</p>
}
