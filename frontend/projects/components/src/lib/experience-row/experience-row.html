<span class="thumb thumb--sm" aria-hidden="true" [class.thumb--emoji]="!photo()">
  @if (photo()) {
    <img class="thumb__photo" alt="" [src]="photo()" />
  } @else {
    {{ emoji() }}
  }
</span>
<span class="card__main">
  @if (kicker()) {
    <span class="card__kicker">{{ kicker() }}</span>
  }
  <span class="row__title row__title--display" [class.truncate]="!kicker()">{{ title() }}</span>
  <span pk-rating [value]="rating()" [label]="ratings()"></span>
</span>
@if (!kicker()) {
  <svg pk-icon name="chevron-right" size="md"></svg>
}
