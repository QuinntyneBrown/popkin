@if (label(); as label) {
  <span class="field__label">{{ label }}</span>
} @else {
  <h2 class="picker__heading">{{ heading() }}</h2>
}
<div class="swatches" role="group" aria-label="Colour">
  @for (colour of options(); track colour) {
    <button
      class="swatch"
      type="button"
      [attr.data-accent]="colour.toLowerCase()"
      [attr.aria-label]="colour"
      [attr.aria-pressed]="colour === value()"
      (click)="value.set(colour)"
    ></button>
  }
</div>
