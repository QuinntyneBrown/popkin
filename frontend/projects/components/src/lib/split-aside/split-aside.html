@if (photo()) {
  <img class="split-aside__photo" alt="" [src]="photo()" />
  @if (heading()) {
    <p class="split-aside__caption">
      <strong class="split-aside__caption-title">{{ heading() }}</strong>
      @if (text()) {
        <span class="split-aside__caption-text">{{ text() }}</span>
      }
    </p>
  }
} @else {
  <div class="split-aside__body" [class.split-aside__body--center]="justify() === 'center'">
    @if (icon()) {
      <span class="split-aside__icon" aria-hidden="true">{{ icon() }}</span>
    }
    @if (kicker()) {
      <p class="split-aside__kicker">{{ kicker() }}</p>
    }
    @if (heading()) {
      <p class="split-aside__title">{{ heading() }}</p>
    }
    <ng-content />
    @if (text()) {
      <p class="split-aside__text">{{ text() }}</p>
    }
  </div>
}
