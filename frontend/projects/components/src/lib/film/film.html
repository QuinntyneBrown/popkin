<div class="film__frame">
  <video
    #video
    class="film__video"
    preload="none"
    playsinline
    tabindex="-1"
    [attr.aria-label]="label()"
    [src]="src()"
    [poster]="still()"
    [controls]="playing()"
  ></video>
  @if (!playing()) {
    <button class="film__poster" type="button" [attr.aria-label]="playLabel()" (click)="play()">
      <img class="film__still" [src]="still()" alt="" />
      <span class="film__scrim"></span>
      <span class="film__play"><svg pk-icon class="film__play-icon" name="play"></svg></span>
      <span class="film__length">{{ length() }}</span>
    </button>
  }
</div>
@if (chapters().length) {
  <ol class="film__chapters" aria-label="Chapters">
    @for (chapter of chapters(); track chapter.at; let index = $index) {
      <li>
        <button
          class="film__chapter"
          type="button"
          [attr.aria-current]="playing() && current() === index ? 'true' : null"
          (click)="play(index)"
        >
          <span class="film__time">{{ chapter.time }}</span>
          <span class="film__title">{{ chapter.title }}</span>
        </button>
      </li>
    }
  </ol>
}
