<!-- Choosing outside closes it by pointer; the keyboard has Escape and Close (L2-057 AC2). -->

<div class="backdrop" aria-hidden="true" (click)="ref.close()"></div>
<div class="dialog">
  <div class="dialog__panel">
    <div class="dialog__grip" aria-hidden="true"></div>
    <div class="dialog__header">
      <h2 class="dialog__title" id="dlg-title">{{ heading() }}</h2>
      <button
        pk-icon-button
        type="button"
        icon="close"
        size="md"
        label="Close"
        (click)="ref.close()"
      ></button>
    </div>
    @if (description()) {
      <p class="dialog__desc" id="dlg-desc">{{ description() }}</p>
    }
    <div class="dialog__body"><ng-content /></div>
    <div class="dialog__footer"><ng-content select="[slot=footer]" /></div>
  </div>
</div>
