@for (option of options(); track option.emoji) {
  <button
    class="react-bar__emoji"
    type="button"
    [attr.aria-label]="'React ' + option.name.toLowerCase()"
    [attr.aria-pressed]="pressed().includes(option.emoji)"
    (click)="react.emit(option.emoji)"
  >
    {{ option.emoji }}
  </button>
}
<button
  pk-icon-button
  type="button"
  icon="smile-plus"
  [label]="moreLabel()"
  (click)="more.emit()"
></button>
