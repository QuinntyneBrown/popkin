<div class="contact-list__head" aria-hidden="true">
  <span>Name</span><span>Circle</span><span>Next date</span><span>Last talked</span>
</div>
<ul class="divided" [attr.aria-label]="label()">
  @for (person of people(); track $index) {
    <li>
      <a class="contact-row" [routerLink]="person.link">
        <span class="contact-row__who">
          <span
            pk-avatar
            size="lg"
            [name]="person.name"
            [initials]="person.initials"
            [photo]="person.photo"
            [attr.data-accent]="person.accent"
          ></span>
          <span class="contact-row__id">
            <span class="row__title">{{ person.name }}</span>
            @if (person.relation) {
              <span class="row__text">{{ person.relation }}</span>
            }
          </span>
        </span>
        <span class="contact-row__cell">{{ person.circle }}</span>
        <span class="contact-row__cell">
          @if (person.next; as next) {
            <strong>{{ next.date }}</strong> · {{ next.what }}
          }
        </span>
        <span class="contact-row__last" [class.contact-row__last--quiet]="person.quiet"
          ><span class="visually-hidden">Last talked </span>{{ person.lastTalked }}</span
        >
      </a>
    </li>
  }
</ul>
