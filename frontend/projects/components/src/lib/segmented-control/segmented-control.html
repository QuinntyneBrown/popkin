@for (option of options(); track option.value; let i = $index) {
  <button
    #option
    class="segmented__option"
    type="button"
    [attr.role]="kind() === 'radio' ? 'radio' : 'tab'"
    [attr.aria-checked]="kind() === 'radio' ? option.value === value() : null"
    [attr.aria-selected]="option.value === value()"
    [tabIndex]="option.value === value() ? 0 : -1"
    [disabled]="disabled()"
    [attr.aria-label]="option.count === undefined ? null : option.label + ' ' + option.count"
    (click)="choose(option.value)"
    (keydown)="move($event, i)"
  >
    {{ option.label
    }}<span class="segmented__count" [hidden]="option.count === undefined">{{ option.count }}</span>
  </button>
}
