<span
  pk-avatar
  [size]="avatarSize()"
  [initials]="avatar()?.initials ?? ''"
  [photo]="avatar()?.photoUrl"
  [blank]="!avatar()"
  [attr.data-accent]="avatar()?.accent"
></span>
<div class="comment__main">
  <div class="comment__head">
    <span class="comment__name">{{ name() }}</span>
    @if (stars()) {
      <span pk-rating [value]="stars()" [prefix]="ratedText()"></span>
    }
    @if (time()) {
      <span class="text-caption">{{ time() }}</span>
    }
  </div>
  <p class="comment__text">{{ text() }}</p>
</div>
@if (deletable()) {
  <button
    pk-icon-button
    class="comment__delete"
    type="button"
    icon="trash"
    [label]="deleteLabel()"
    (click)="delete.emit()"
  ></button>
}
