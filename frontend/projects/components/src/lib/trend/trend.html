@for (y of chart().grid; track $index) {
  <svg:line
    class="trend__grid"
    [attr.x1]="chart().left"
    [attr.x2]="chart().right"
    [attr.y1]="y"
    [attr.y2]="y"
  />
}
<svg:line
  class="trend__axis"
  [attr.x1]="chart().left"
  [attr.x2]="chart().right"
  [attr.y1]="chart().axis"
  [attr.y2]="chart().axis"
/>
<svg:path class="trend__area" [attr.d]="chart().area" />
<svg:path class="trend__line" [attr.d]="chart().line" />
<svg:circle class="trend__dot" [attr.cx]="chart().dot.x" [attr.cy]="chart().dot.y" r="5" />
@for (label of chart().labels; track $index) {
  <svg:text
    class="trend__label"
    [attr.x]="label.x"
    [attr.y]="label.y"
    [attr.text-anchor]="label.anchor"
  >
    {{ label.text }}
  </svg:text>
}
