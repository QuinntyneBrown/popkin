<span class="field__label" [class.visually-hidden]="hideLabel()" [id]="labelId()">{{
  label()
}}</span>
<div
  class="chips"
  role="radiogroup"
  [id]="fieldId()"
  [attr.aria-labelledby]="labelId()"
  [attr.aria-disabled]="disabled() ? 'true' : null"
>
  @for (option of options(); track option.value; let i = $index) {
    <button
      #chip
      pk-chip
      type="button"
      role="radio"
      [outline]="outline()"
      [attr.aria-checked]="option.value === value()"
      [tabIndex]="option.value === value() ? 0 : -1"
      (click)="choose(option.value)"
      (keydown)="move($event, i)"
    >
      @if (option.icon) {
        <svg pk-icon [name]="option.icon" size="md"></svg>&nbsp;{{ option.label }}
      } @else {
        {{ option.label }}
      }
    </button>
  }
</div>
