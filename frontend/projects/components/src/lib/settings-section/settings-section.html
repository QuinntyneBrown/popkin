<div class="settings-section__head">
  <div>
    <h2 class="settings-section__title" [id]="id">{{ heading() }}</h2>
    @if (text()) {
      <p class="settings-section__sub">{{ text() }}</p>
    }
  </div>
  @if (toggle(); as word) {
    <span class="settings-section__switch">
      {{ word }}
      <button
        pk-switch
        [attr.aria-label]="toggleName() ?? word"
        [disabled]="toggleDisabled()"
        [(checked)]="checked"
      ></button>
    </span>
  }
</div>
<div class="settings-section__body"><ng-content /></div>
