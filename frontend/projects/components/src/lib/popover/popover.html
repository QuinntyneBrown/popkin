@if (add()) {
  <button
    class="popover__trigger"
    type="button"
    aria-haspopup="dialog"
    [attr.aria-expanded]="open()"
    (click)="toggle()"
  >
    <svg pk-icon name="plus" size="sm"></svg> {{ label() }}
  </button>
}
<ng-content select="[slot=trigger]" />
@if (open()) {
  <div
    class="popover"
    role="dialog"
    [class.popover--end]="end()"
    [attr.aria-label]="label()"
    (keydown.arrowdown)="down($event)"
  >
    <ng-content />
  </div>
}
