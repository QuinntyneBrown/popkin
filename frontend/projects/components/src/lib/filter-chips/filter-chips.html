@for (option of options(); track option.value) {
  <button
    pk-chip
    type="button"
    [count]="option.count"
    [attr.aria-pressed]="option.value === value()"
    (click)="value.set(option.value)"
  >
    @if (option.key) {
      <span pk-link-key [kind]="option.key"></span>
    }
    {{ option.label }}
  </button>
}
