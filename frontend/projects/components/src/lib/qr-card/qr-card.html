<div class="qr-card__frame">
  <svg
    class="qr"
    role="img"
    [attr.viewBox]="'0 0 ' + count() + ' ' + count()"
    [attr.aria-label]="'QR code for ' + link()"
  >
    <svg:path class="qr__cells" [attr.d]="cells()" />
    @for (finder of finders(); track $index) {
      <svg:rect
        class="qr__cells"
        [attr.x]="finder[0]"
        [attr.y]="finder[1]"
        width="7"
        height="7"
        rx="2"
      />
      <svg:rect
        class="qr__hole"
        [attr.x]="finder[0] + 1"
        [attr.y]="finder[1] + 1"
        width="5"
        height="5"
        rx="1.4"
      />
      <svg:rect
        class="qr__cells"
        [attr.x]="finder[0] + 2"
        [attr.y]="finder[1] + 2"
        width="3"
        height="3"
        rx="1"
      />
    }
    <svg:rect
      class="qr__logo"
      [attr.x]="logo().at + 0.5"
      [attr.y]="logo().at + 0.5"
      [attr.width]="logo().side - 1"
      [attr.height]="logo().side - 1"
      rx="1.6"
    />
    <svg:svg
      class="qr__mark"
      viewBox="0 0 64 64"
      aria-hidden="true"
      [attr.x]="logo().at + logo().side * 0.15"
      [attr.y]="logo().at + logo().side * 0.15"
      [attr.width]="logo().side * 0.7"
      [attr.height]="logo().side * 0.7"
    >
      <svg:defs>
        <svg:mask [attr.id]="maskId" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
          <svg:rect width="64" height="64" fill="#fff" />
          <svg:circle cx="49" cy="15" r="14.5" fill="#000" />
        </svg:mask>
      </svg:defs>
      <svg:g [attr.mask]="'url(#' + maskId + ')'" fill="currentColor" stroke="currentColor">
        <svg:circle cx="26" cy="38" r="22" stroke="none" />
        <svg:path d="M11 47 L4.5 60.5 L20 56 Z" stroke-width="3" stroke-linejoin="round" />
      </svg:g>
      <svg:circle cx="49" cy="15" r="9.5" fill="currentColor" />
    </svg:svg>
  </svg>
</div>
@if (name()) {
  <p class="qr-card__name">
    @if (emoji()) {
      <span class="qr-card__emoji" aria-hidden="true">{{ emoji() }}</span>
    }
    <span class="truncate">{{ name() }}</span>
  </p>
}
<p class="qr-card__link">{{ link() }}</p>
