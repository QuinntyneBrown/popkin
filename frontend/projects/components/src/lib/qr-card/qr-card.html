<div class="qr-card__frame">
  <svg pk-qr [modules]="modules()" [link]="link()" [size]="size()"></svg>
</div>
@if (name()) {
  <p class="qr-card__name">
    @if (emoji()) {
      <span class="qr-card__emoji" aria-hidden="true">{{ emoji() }}</span>
    }
    <span class="truncate">{{ name() }}</span>
  </p>
}
<p class="qr-card__link">{{ link() }}</p>
