<svg pk-icon class="banner__icon" size="md" [name]="shownIcon()"></svg>
<div class="banner__text">
  <strong>{{ heading() }}</strong>
  @if (text()) {
    {{ text() }}
  }
</div>
@if (action(); as words) {
  @if (actionLink(); as route) {
    <a class="banner__action" [routerLink]="route">{{ words }}</a>
  } @else {
    <button class="banner__action" type="button" (click)="acted.emit()">{{ words }}</button>
  }
}
<ng-content />
@if (dismissible()) {
  <button
    pk-icon-button
    class="banner__dismiss"
    type="button"
    icon="close"
    size="md"
    label="Dismiss"
    (click)="dismissed.emit()"
  ></button>
}
