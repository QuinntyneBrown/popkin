<span class="field__label" [id]="labelId()">{{ label() }}</span>
<div class="kind-grid" role="radiogroup" [id]="fieldId()" [attr.aria-labelledby]="labelId()">
  @for (option of options(); track option.value; let i = $index) {
    <button
      #option
      class="kind-grid__option"
      type="button"
      role="radio"
      [attr.aria-checked]="option.value === value()"
      [tabIndex]="option.value === tabStop() ? 0 : -1"
      (click)="value.set(option.value)"
      (keydown)="move($event, i)"
    >
      <svg pk-icon [name]="option.icon" size="md"></svg>
      {{ option.label }}
    </button>
  }
</div>
