<label class="limit__label" [for]="fieldId()">
  <span class="limit__name">{{ name() }}</span>
  @if (help()) {
    <span class="limit__help" [id]="fieldId() + '-help'">{{ help() }}</span>
  }
</label>
<span class="limit__value">
  <input
    class="input"
    type="number"
    inputmode="numeric"
    [id]="fieldId()"
    [min]="min()"
    [attr.max]="max() ?? null"
    [value]="value()"
    [attr.data-dirty]="dirty() ? 'true' : null"
    [attr.aria-invalid]="error() ? 'true' : null"
    [attr.aria-describedby]="describedBy()"
    [disabled]="disabled()"
    (input)="input($event)"
    (blur)="blur()"
  />
  <span class="limit__unit">{{ unit() }}</span>
</span>
@if (error()) {
  <p class="field__error" [id]="fieldId() + '-err'">
    <svg pk-icon name="alert" size="sm"></svg><span>{{ error() }}</span>
  </p>
}
