@for (option of options(); track option.id; let i = $index) {
  <li [attr.data-accent]="option.accent">
    <button
      #option
      class="pick-list__item"
      type="button"
      role="option"
      [attr.aria-selected]="option.id === value()"
      [tabIndex]="tabbable(option.id, i) ? 0 : -1"
      [disabled]="disabled()"
      (click)="value.set(option.id)"
      (keydown)="move($event, i)"
    >
      @if (option.person; as person) {
        <span
          pk-avatar
          size="xs"
          [name]="option.name"
          [initials]="person.initials"
          [photo]="person.photo"
        ></span>
        <span class="pick-list__name">{{ option.name }}</span>
        <span class="pick-list__meta">{{ person.meta }}</span>
      } @else {
        <span pk-popkin-tile size="xs" [emoji]="option.emoji ?? ''"></span>
        <span class="pick-list__name">{{ option.name }}</span>
        <span class="pick-list__detail">{{ option.detail }}</span>
      }
    </button>
  </li>
}
@for (note of notes(); track note) {
  <li role="presentation">
    <p class="pick-list__note">{{ note }}</p>
  </li>
}
