<div
  pk-page-head
  heading="Features"
  sub="Switch a feature off for everyone, roll it out to chosen Popkins, or turn it on for all. A change reaches every Popkin within a minute; nothing is deleted."
></div>
@switch (store.status()) {
  @case ('loading') {
    <p class="visually-hidden" role="status">Loading the features…</p>
    <section pk-panel [body]="true"><div pk-feature-panel [loading]="true"></div></section>
    <section pk-panel [body]="true"><div pk-feature-panel [loading]="true"></div></section>
  }
  @case ('failed') {
    <section pk-panel>
      <div
        pk-empty-state
        icon="alert"
        heading="Couldn’t load the features"
        text="The admin API didn’t answer. Nothing has changed; try again, or check Health if it keeps happening."
        [compact]="true"
        [panel]="true"
      >
        <button pk-button type="button" variant="primary" size="md" (click)="store.load()">
          <svg pk-icon name="retry" size="sm"></svg>Try again
        </button>
        <a pk-button variant="secondary" size="md" routerLink="/health">Open Health</a>
      </div>
    </section>
  }
  @default {
    @for (view of views(); track view.feature.feature) {
      <section pk-panel [body]="true">
        <div
          pk-feature-panel
          [name]="view.feature.feature"
          [about]="view.about"
          [reach]="view.reach"
          [since]="view.since"
          [mode]="view.feature.mode"
          [chosen]="view.chosen"
          [disabledReason]="blocked()"
          (modeChosen)="chose(view.feature, $event)"
          (removeChosen)="remove(view.feature, $event)"
          (addChosen)="add(view.feature)"
        ></div>
      </section>
    }
  }
}
