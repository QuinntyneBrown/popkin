<a pk-skip-link>Skip to content</a>
@if (!routeData()) {
  <!-- No outlet until the first navigation ends, so its page is made once, in its own frame. -->
} @else if (routeData()?.shell === 'admin') {
  <div
    pk-admin-shell
    [sections]="sections"
    [current]="routeData()?.page"
    [me]="me()"
    [label]="label"
    [notice]="notice()"
    (signOut)="signOut()"
    (openMenu)="openMenu()"
  >
    <router-outlet />
  </div>
} @else {
  <router-outlet />
}
<div pk-toast-region>
  @for (toast of toaster.toasts(); track toast.id) {
    <div
      pk-toast
      [variant]="toast.variant"
      [heading]="toast.heading"
      [text]="toast.text"
      (dismissed)="toaster.dismiss(toast.id)"
    ></div>
  }
</div>
