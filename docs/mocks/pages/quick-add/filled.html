<div class="screen"><header class="topbar topbar--line topbar--sticky"><a class="icon-btn" href="../../pages/contacts-today/default.html" aria-label="Cancel" title="Cancel"><svg class="icon icon--md" aria-hidden="true" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></a><div class="topbar__titles"><h1 class="topbar__title truncate">Add someone</h1></div><div class="topbar__end" style="padding-right: var(--space-2);"><a class="btn btn--primary btn--sm" href="../../pages/contact-added/default.html">Save</a></div></header><main id="main" class="screen__body"><div class="container container--narrow stack"><form class="stack" id="quick-add" novalidate>
<div class="cluster" style="flex-wrap: nowrap; align-items: flex-start; gap: var(--space-4);"><button class="avatar avatar--xl avatar--blank" type="button" aria-label="Add a photo" style="border: 0; padding: 0;"><svg class="icon icon--md" aria-hidden="true" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></button><div class="grow"><div class="field"><label class="visually-hidden" for="name">Name</label><input class="input input--display" id="name" type="text" value="Femi Bankole" placeholder="Their name" autocomplete="off" enterkeyhint="done"></div></div></div>
<div class="field"><label class="field__label" for="phone">Phone <span class="optional">Optional</span></label><input class="input" id="phone" type="tel" inputmode="tel" autocomplete="off" value="+44 7700 900631" enterkeyhint="done"></div>
<div class="field"><label class="field__label" for="relation">Who are they? <span class="optional">Optional</span></label><input class="input" id="relation" type="text" value="Grace’s fiancé" placeholder="Neighbour, Grace’s fiancé…" enterkeyhint="done"></div>
<div><span class="field__label" id="circle-label">Circle</span><div class="chips" role="radiogroup" aria-labelledby="circle-label"><button class="chip chip--outline" type="button" role="radio" aria-checked="false">Family</button><button class="chip chip--outline" type="button" role="radio" aria-checked="true">Friends</button><button class="chip chip--outline" type="button" role="radio" aria-checked="false">Work</button><button class="chip chip--outline" type="button" role="radio" aria-checked="false">Neighbours</button><button class="chip chip--outline" type="button" role="radio" aria-checked="false">Clubs</button></div></div>
<div><button class="text-btn text-btn--accent" type="button" style="padding-inline: 0;"><svg class="icon icon--md" aria-hidden="true" viewBox="0 0 24 24"><path d="M15 13a3 3 0 1 0-6 0"/><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/><circle cx="12" cy="8" r="2"/></svg>Pick from my phone’s contacts</button></div>
</form>
<p class="mock-note">Save adds the contact and opens the confirmation. Enter in any field saves, so every field carries <code>enterkeyhint="done"</code>.</p></div></main></div>
