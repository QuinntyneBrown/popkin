name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels the older run; a run on main is never cancelled, since
# it ends in a deployment (ADR 0018).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json
      - name: Run the backend suite
        shell: pwsh
        run: ./eng/Test-Backend.ps1

  frontend:
    name: Frontend lint, format, unit tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run design:check
      - run: npm run lint
      - run: npm run format:check
      # ADR 0011: the unit tests of the api library's stores and pure helpers.
      - run: npm test
      - run: npm run build
      # ADR 0017: the marketing site, a second application of the workspace.
      - run: npm run build:marketing

  e2e:
    # ADR 0005: the suite answers every API request from its recording; no API, no database.
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      # ADR 0006: behaviour specs only; the sweeps run by hand, never in CI.
      - name: Run the behaviour specs against the app
        run: npm test
        working-directory: e2e
      # ADR 0008: the component parity specs, against baselines rendered from docs/mocks.
      - name: Compare every component with its mock
        run: npm run parity
        working-directory: e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  images:
    # ADR 0013: every pull request builds the images, and pushes none.
    name: Build the images
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/src/Popkin.Api/Dockerfile
          cache-from: type=gha,scope=popkin-api
      - uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/src/Popkin.Worker/Dockerfile
          cache-from: type=gha,scope=popkin-worker
      - uses: docker/build-push-action@v7
        with:
          context: frontend
          file: infra/web/Dockerfile
          build-contexts: web=infra/web
          cache-from: type=gha,scope=popkin-web

  deploy:
    # ADR 0018: every commit to main that passes is deployed to Azure.
    name: Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, e2e]
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
