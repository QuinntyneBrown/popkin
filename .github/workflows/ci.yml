name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json
      - name: Run the backend suite
        shell: pwsh
        run: ./eng/Test-Backend.ps1

  frontend:
    name: Frontend lint, format, unit tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run design:check
      - run: npm run lint
      - run: npm run format:check
      # ADR 0011: the unit tests of the api library's stores and pure helpers.
      - run: npm test
      - run: npm run build
      # ADR 0017: the marketing site, a second application of the workspace.
      - run: npm run build:marketing

  e2e:
    # ADR 0005: the suite answers every API request from its recording; no API, no database.
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      # ADR 0006: behaviour specs only; the sweeps run by hand, never in CI.
      - name: Run the behaviour specs against the app
        run: npm test
        working-directory: e2e
      # ADR 0008: the component parity specs, against baselines rendered from docs/mocks.
      - name: Compare every component with its mock
        run: npm run parity
        working-directory: e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
